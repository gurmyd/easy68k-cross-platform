# Continuous integration (ARCHITECTURE.md 6, 7.3, 7.4).
#
# Every job of 7.4 is here from wave 0. A job whose tests, script or folder do
# not exist yet is skipped, and GitHub shows it as skipped: the `plan` job
# looks at the checkout and sets one output per guard; each job's `if:` reads
# it. When the owning package adds the file a guard names, its job starts to
# run with no change to this workflow. The guards:
#
#   job / step                 runs when this exists
#   conformance                tests/conformance/*/vitest.config.ts or tests/parity/vitest.config.ts
#   e2e                        tests/e2e/**/*.spec.ts or tests/a11y/**/*.spec.ts
#   unit: integration step     tests/integration/*/vitest.config.ts (npm run test:integration; I1, I2, I3)
#   browser-checks: one step per browser check script, each guarded by its file
#     (the table of `checks` in the plan step; npm run check:<name>):
#       gallery       app/src/ui/components/gallery/check-gallery.mjs   W2
#       shell         app/src/ui/shell/check-shell.mjs                   W3
#       editor        app/src/ui/editor/check-editor.mjs                 E2
#       highlight     app/src/features/highlight/check-highlight.mjs     E3
#       files         app/src/features/files/check-files.mjs             FS1
#       documents     app/src/features/documents/check-documents.mjs     E1
#       help          app/src/features/help/check-help.mjs               H1
#       surface       app/src/core/sim-host/surface/check-surface.mjs    SH1
#       easybin       app/src/features/easybin/check-easybin.mjs         B1
#       memory-stack  app/src/features/memory/check-memory-stack.mjs     U2
#       engine        app/src/engine/browser.test.ts (check:engine-browsers) W4
#       text          app/src/core/sim-host/text/check-text.mjs          SH3
#       output        app/src/features/output/check-output.mjs           SH4
#       hardware      app/src/features/hardware/check-hardware.mjs       SH7
#       run           app/src/features/run/check-run.mjs                 SH8
#       sim-main      app/src/features/sim-main/check-sim-main.mjs       U1
#       pwa           app/src/features/pwa/check-pwa.mjs                 DV1
#       wave1         tests/integration/wave1/check-wave1.mjs            I1
#       options       app/src/features/options/check-options.mjs         E4
#       find          app/src/features/find/check-find.mjs               E6
#       print         app/src/features/print/check-print.mjs             E6
#       fsaccess      app/src/features/files-fsaccess/check-fsaccess.mjs FS2
#       assemble      app/src/features/assemble/check-assemble.mjs       E5
#       audio         app/src/features/audio/check-audio.mjs             SH5
#       sim_files     app/src/features/sim-files/check-sim-files.mjs     SH6
#       breakpoints   app/src/features/breakpoints/check-breakpoints.mjs U3
#       log           app/src/features/log/check-log.mjs                 U4
#       wave2         tests/integration/wave2/check-wave2.mjs            I2
#       examples      tests/conformance/examples/check-examples.mjs      X3
#       desktop_devices app/src/features/desktop-devices/check-desktop-devices.mjs DV4
#       a11y          tests/a11y/check-a11y.mjs                          Q1 (group accessibility)
#     the stage of additions (ARCHITECTURE-PLUS P5; branch plus):
#       dock          app/src/ui/dock/check-dock.mjs                     N1
#       history       app/src/fs/check-history.mjs                       N3
#       history_ui    app/src/features/history/check-history-ui.mjs      N4
#       viewer        app/src/features/viewer/check-viewer.mjs           N6
#       status        app/src/ui/editor/check-status.mjs                 N8
#       additions     app/src/features/additions/check-additions.mjs     N7
#   check: packaging unit tests  tests/desktop/packaged/playwright.config.ts (project unit, DV3)
#   check: documents           tools/check-docs.test.mjs            (npm run check:docs, DOC1)
#   e2e-stability              as e2e, on a manual run (input e2e_stability) or a push of a v* tag (6.9 item 10, X1)
#   perf                       tests/perf/check-perf.mjs (npm run check:perf, P1): the functional parts on
#                              every push; every part, with the thresholds of 6.9 item 9 judged in
#                              Chromium on ubuntu-latest, on a manual run or a push of a v* tag
#   readme                     README.md's commands on macOS and Windows (DOC1): weekly, or a manual
#                              run with the input readme ticked
#   windows-oracles: GDI       tests/oracle/gdi-capture/run.mjs     (npm run oracle:gdi, T2)
#   windows-oracles: twins     tests/oracle/native-twin/run.mjs     (npm run oracle:twins, T4)
#   windows-oracles: asm CLI   tests/oracle/asm-cli/run.mjs         (T1)
#   windows-oracles: engines   weekly schedule or manual run: Windows engine build vs Linux (7.3)
#   desktop-dev                tests/desktop/dev/playwright.config.ts (DV2), and desktop/**, app/** or tests/desktop/dev/** changed
#   windows-oracles uploads build/gdi-capture/run when the GDI step fails (for other-windows.json),
#   and its report.txt and differences/ after every GDI step (gdi-capture-report)
#
# check and unit run on every push and pull request.
#
# The weekly schedule exists for the Windows engine comparison of 7.3 and for
# the README job: on a scheduled run, plan sets every guard but engines_weekly
# and readme to false and check and unit are skipped, so the run is engines +
# windows-oracles (with only the comparison step) + readme. A manual run
# (workflow_dispatch) runs everything a push would, plus the comparison, the
# whole performance check and, unless its input is unticked, the 20-repetition
# stability job; the README job only when its input is ticked. The engines come from the reusable workflow
# engines.yml as the artifact "engine-dist"; a job downloads it when it exists.
# A job that has it sets EASY68K_REQUIRE_ENGINES=1 when the artifact holds both
# engines, so that a test that needs engine/dist fails there instead of
# skipping.
#
# `npm ci` downloads the Electron binary (the root postinstall,
# tools/install-electron.mjs). Only desktop-dev starts Electron, so every job
# skips that download (ELECTRON_SKIP_BINARY_DOWNLOAD below) and desktop-dev
# installs the binary itself, from its own cache.
#
# Shared configuration: written in wave 0, changed only at an integration gate.

name: ci

on:
  push:
  pull_request:
  schedule:
    # Weekly, Monday 04:17 UTC: only the comparison of the Windows engine
    # build with the canonical Linux build (7.3); every other job is skipped.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      e2e_stability:
        description: 'Also run the end-to-end suites 20 times in a row on ubuntu-latest (6.9 item 10; about 1.5 hours)'
        type: boolean
        default: true
      readme:
        description: 'Also follow README.md command by command on macos-latest and windows-latest (installs Emscripten and builds the engines; about an hour)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

defaults:
  run:
    # One shell on all three systems (Git Bash on Windows). PowerShell's npm
    # shim would swallow the "--" of `npm run x -- args`.
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      conformance: ${{ steps.guards.outputs.conformance }}
      e2e: ${{ steps.guards.outputs.e2e }}
      integration: ${{ steps.guards.outputs.integration }}
      gallery: ${{ steps.guards.outputs.gallery }}
      shell: ${{ steps.guards.outputs.shell }}
      editor: ${{ steps.guards.outputs.editor }}
      highlight: ${{ steps.guards.outputs.highlight }}
      files: ${{ steps.guards.outputs.files }}
      documents: ${{ steps.guards.outputs.documents }}
      help: ${{ steps.guards.outputs.help }}
      surface: ${{ steps.guards.outputs.surface }}
      easybin: ${{ steps.guards.outputs.easybin }}
      memory_stack: ${{ steps.guards.outputs.memory_stack }}
      engine_browsers: ${{ steps.guards.outputs.engine_browsers }}
      text: ${{ steps.guards.outputs.text }}
      output: ${{ steps.guards.outputs.output }}
      hardware: ${{ steps.guards.outputs.hardware }}
      run: ${{ steps.guards.outputs.run }}
      sim_main: ${{ steps.guards.outputs.sim_main }}
      pwa: ${{ steps.guards.outputs.pwa }}
      wave1: ${{ steps.guards.outputs.wave1 }}
      options: ${{ steps.guards.outputs.options }}
      find: ${{ steps.guards.outputs.find }}
      print: ${{ steps.guards.outputs.print }}
      fsaccess: ${{ steps.guards.outputs.fsaccess }}
      assemble: ${{ steps.guards.outputs.assemble }}
      audio: ${{ steps.guards.outputs.audio }}
      sim_files: ${{ steps.guards.outputs.sim_files }}
      breakpoints: ${{ steps.guards.outputs.breakpoints }}
      log: ${{ steps.guards.outputs.log }}
      wave2: ${{ steps.guards.outputs.wave2 }}
      examples: ${{ steps.guards.outputs.examples }}
      desktop_devices: ${{ steps.guards.outputs.desktop_devices }}
      a11y: ${{ steps.guards.outputs.a11y }}
      dock: ${{ steps.guards.outputs.dock }}
      history: ${{ steps.guards.outputs.history }}
      history_ui: ${{ steps.guards.outputs.history_ui }}
      viewer: ${{ steps.guards.outputs.viewer }}
      status: ${{ steps.guards.outputs.status }}
      additions: ${{ steps.guards.outputs.additions }}
      e2e_stability: ${{ steps.guards.outputs.e2e_stability }}
      perf: ${{ steps.guards.outputs.perf }}
      perf_full: ${{ steps.guards.outputs.perf_full }}
      readme: ${{ steps.guards.outputs.readme }}
      browser_checks: ${{ steps.guards.outputs.browser_checks }}
      gdi: ${{ steps.guards.outputs.gdi }}
      twins: ${{ steps.guards.outputs.twins }}
      asm_cli: ${{ steps.guards.outputs.asm_cli }}
      engines_weekly: ${{ steps.guards.outputs.engines_weekly }}
      windows_oracles: ${{ steps.guards.outputs.windows_oracles }}
      desktop_dev: ${{ steps.guards.outputs.desktop_dev }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide which jobs can run
        id: guards
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          STABILITY_INPUT: ${{ inputs.e2e_stability }}
          README_INPUT: ${{ inputs.readme }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          has() { [ -n "$(find "$@" -print -quit 2>/dev/null)" ]; }
          flag() { if "$@"; then echo true; else echo false; fi; }

          conformance=$(flag has tests/conformance -mindepth 2 -maxdepth 2 -name vitest.config.ts)
          for suite in tests/parity tests/perf tests/a11y; do [ -f "$suite/vitest.config.ts" ] && conformance=true; done
          e2e=$(flag has tests/e2e tests/a11y -name '*.spec.ts')
          integration=$(flag has tests/integration -mindepth 2 -maxdepth 2 -name vitest.config.ts)
          # The browser checks: output name and the file whose existence turns its step on.
          checks='
            gallery         app/src/ui/components/gallery/check-gallery.mjs
            shell           app/src/ui/shell/check-shell.mjs
            editor          app/src/ui/editor/check-editor.mjs
            highlight       app/src/features/highlight/check-highlight.mjs
            files           app/src/features/files/check-files.mjs
            documents       app/src/features/documents/check-documents.mjs
            help           app/src/features/help/check-help.mjs
            surface         app/src/core/sim-host/surface/check-surface.mjs
            easybin         app/src/features/easybin/check-easybin.mjs
            memory_stack    app/src/features/memory/check-memory-stack.mjs
            engine_browsers app/src/engine/browser.test.ts
            text            app/src/core/sim-host/text/check-text.mjs
            output          app/src/features/output/check-output.mjs
            hardware        app/src/features/hardware/check-hardware.mjs
            run             app/src/features/run/check-run.mjs
            sim_main        app/src/features/sim-main/check-sim-main.mjs
            pwa             app/src/features/pwa/check-pwa.mjs
            wave1           tests/integration/wave1/check-wave1.mjs
            options         app/src/features/options/check-options.mjs
            find            app/src/features/find/check-find.mjs
            print           app/src/features/print/check-print.mjs
            fsaccess        app/src/features/files-fsaccess/check-fsaccess.mjs
            assemble        app/src/features/assemble/check-assemble.mjs
            audio           app/src/features/audio/check-audio.mjs
            sim_files       app/src/features/sim-files/check-sim-files.mjs
            breakpoints     app/src/features/breakpoints/check-breakpoints.mjs
            log             app/src/features/log/check-log.mjs
            wave2           tests/integration/wave2/check-wave2.mjs
            examples        tests/conformance/examples/check-examples.mjs
            desktop_devices app/src/features/desktop-devices/check-desktop-devices.mjs
            a11y            tests/a11y/check-a11y.mjs
            dock            app/src/ui/dock/check-dock.mjs
            history         app/src/fs/check-history.mjs
            history_ui      app/src/features/history/check-history-ui.mjs
            viewer          app/src/features/viewer/check-viewer.mjs
            status          app/src/ui/editor/check-status.mjs
            additions       app/src/features/additions/check-additions.mjs
          '
          check_names=""
          browser_checks=false
          while read -r name file; do
            [ -n "$name" ] || continue
            value=$(flag test -f "$file")
            eval "$name=\$value"
            check_names="$check_names $name"
            [ "$value" = true ] && browser_checks=true
          done <<< "$checks"
          gdi=$(flag test -f tests/oracle/gdi-capture/run.mjs)
          twins=$(flag test -f tests/oracle/native-twin/run.mjs)
          asm_cli=$(flag test -f tests/oracle/asm-cli/run.mjs)
          engines_weekly=false
          case "$EVENT" in schedule|workflow_dispatch) engines_weekly=true ;; esac
          windows_oracles=false
          for g in "$gdi" "$twins" "$asm_cli" "$engines_weekly"; do [ "$g" = true ] && windows_oracles=true; done

          # desktop-dev: only when desktop/** or app/** changed (7.4), or its own tests
          # (tests/desktop/dev/**, docs/requests/DV2-desktop-dev-paths.md).
          changed=true
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
          esac
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git diff --quiet "$base" HEAD -- desktop app tests/desktop/dev; then changed=false; else changed=true; fi
          fi
          desktop_dev=false
          if [ -f tests/desktop/dev/playwright.config.ts ] && [ "$changed" = true ]; then desktop_dev=true; fi

          # e2e-stability (6.9 item 10: the end-to-end suites pass 20 times in a row on ubuntu-latest
          # in each browser; X1-ci.md). 6.9 is the condition for tagging a release, not a check of
          # every push, and the job takes about twenty times the e2e job (run 44948457389: 56 min in
          # Chromium, 94 in WebKit). So it runs when asked for - a manual run, unless its input
          # e2e_stability is unticked - and on the push of a release tag v*, so that the tag's run
          # shows whether item 10 holds before the draft release of release.yml is published.
          stability_why="not asked for (a manual run or a v* tag)"
          e2e_stability=false
          if [ "$e2e" = true ]; then
            case "$EVENT:$REF" in
              workflow_dispatch:*)
                if [ "$STABILITY_INPUT" != false ]; then e2e_stability=true; stability_why="manual run"; else stability_why="manual run, input e2e_stability unticked"; fi ;;
              push:refs/tags/v*) e2e_stability=true; stability_why="release tag $REF" ;;
            esac
          fi

          # perf (6.9 item 9; docs/requests/P1-perf-scripts.md). The parts a program observes
          # (calibrate: its own clock; surface: its pixels and the 4096 x 4096 surface) are judged on
          # every push, in a few minutes. The whole measurement, with the wall-clock thresholds of 6.9
          # item 9 judged in Chromium on ubuntu-latest (check-perf.mjs --judge auto), is the release
          # condition: it runs when asked for, like e2e-stability - a manual run and the push of a
          # v* tag - so that a push is not judged by a figure of a shared runner's speed.
          perf=$(flag test -f tests/perf/check-perf.mjs)
          perf_full=false
          if [ "$perf" = true ]; then
            case "$EVENT:$REF" in
              workflow_dispatch:* | push:refs/tags/v*) perf_full=true ;;
            esac
          fi

          # readme (docs/requests/DOC1-docs-check.md item 3): README.md's commands, one after the
          # other, on macOS and Windows, where no other job builds the engines or runs the type
          # check and lint. Weekly, and on a manual run with its input ticked.
          readme=false
          case "$EVENT" in
            schedule) readme=true ;;
            workflow_dispatch) [ "$README_INPUT" = true ] && readme=true ;;
          esac

          # The weekly schedule runs the engine comparison and the README job only (7.3, 7.4).
          if [ "$EVENT" = schedule ]; then
            conformance=false; e2e=false; e2e_stability=false; integration=false; gdi=false; twins=false; asm_cli=false; desktop_dev=false
            perf=false; perf_full=false
            for name in $check_names; do eval "$name=false"; done
            browser_checks=false
          fi

          {
            echo "conformance=$conformance"
            echo "e2e=$e2e"
            echo "e2e_stability=$e2e_stability"
            echo "perf=$perf"
            echo "perf_full=$perf_full"
            echo "readme=$readme"
            echo "integration=$integration"
            for name in $check_names; do eval "echo \"$name=\$$name\""; done
            echo "browser_checks=$browser_checks"
            echo "gdi=$gdi"
            echo "twins=$twins"
            echo "asm_cli=$asm_cli"
            echo "engines_weekly=$engines_weekly"
            echo "windows_oracles=$windows_oracles"
            echo "desktop_dev=$desktop_dev"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Job guards"
            echo "| guard | runs |"
            echo "|---|---|"
            for name in conformance e2e e2e_stability perf perf_full readme integration $check_names browser_checks gdi twins asm_cli engines_weekly windows_oracles desktop_dev; do
              eval "value=\$$name"
              echo "| $name | $value |"
            done
            echo
            echo "desktop/**, app/** or tests/desktop/dev/** changed: $changed"
            echo
            echo "e2e stability: $stability_why"
          } >> "$GITHUB_STEP_SUMMARY"

  engines:
    name: engines
    uses: ./.github/workflows/engines.yml

  check:
    name: check (typecheck, lint, format)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # docs/requests/DOC1-docs-check.md: docs/DIFFERENCES.md is what tools/make-differences.mjs
      # builds from 1.4, 1.5 and docs/differences/*.md; the README, the manual list, CONTRIBUTING and
      # the release notes agree with each other and with this workflow. Node's test runner, ~1 s.
      - name: Documents (DOC1)
        if: ${{ !cancelled() && hashFiles('tools/check-docs.test.mjs') != '' }}
        run: npm run check:docs
      # The packaged-app suite's project `unit` (docs/requests/DV3-ci-unit.md): desktop/scripts, the
      # facts release.yml must keep and the harness's parsers. No app, no browser, no Electron;
      # about 5 s. The rest of tests/desktop/packaged runs in release.yml against a built bundle.
      - name: Packaging unit tests (DV3)
        if: ${{ !cancelled() && hashFiles('tests/desktop/packaged/playwright.config.ts') != '' }}
        run: npx playwright test --config tests/desktop/packaged/playwright.config.ts --project unit

  unit:
    name: unit (${{ matrix.os }})
    needs: [plan, engines]
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      # The engines carry their own suites on Node's built-in test runner. They
      # need no npm packages, only engine/dist, and run on every OS so that the
      # WebAssembly builds are proven outside the machine that built them.
      # The pattern is quoted so that Node, not the shell, expands it: the test
      # folders also hold helper scripts and tools that are not tests.
      - name: Assembler engine tests
        if: contains(needs.engines.outputs.available, 'asm')
        working-directory: engine/asm
        run: node --test "test/*.test.mjs"
      - name: Simulator engine tests
        if: contains(needs.engines.outputs.available, 'sim')
        working-directory: engine/sim
        run: node --test "test/*.test.mjs"
      - name: Unit tests
        run: npm test
      # The Node halves of the integration scenarios (9.3): real engines, no browser. They run
      # even when a unit test failed, so that one run shows both.
      - name: Integration scenarios under Node (I1)
        if: ${{ !cancelled() && needs.plan.outputs.integration == 'true' }}
        run: npm run test:integration

  conformance:
    name: conformance (${{ matrix.os }})
    needs: [plan, engines]
    if: needs.plan.outputs.conformance == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      - name: Conformance tests against the committed goldens
        run: npm run test:conformance

  e2e:
    name: e2e (${{ matrix.os }}, ${{ matrix.browser }})
    needs: [plan, engines]
    if: needs.plan.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Restore and save apart, as in browser-checks: the cache is kept even when a test fails.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Playwright's default browser folder on Linux, macOS and Windows.
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}
      - name: Install ${{ matrix.browser }}
        id: browsers-install
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Save Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true' && steps.browsers-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}
      - name: Install the system libraries for ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Production build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e -- --project ${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # 6.9 item 10 and X1's acceptance: the end-to-end suites pass 20 times in a row on ubuntu-latest
  # in each browser (docs/requests/X1-ci.md item 2). The plan runs it on a manual run (input
  # e2e_stability, ticked by default) and on the push of a v* tag, never on the weekly schedule.
  # Measured in run 44948457389: 56 min (Chromium) and 94 min (WebKit) for the 20 repetitions;
  # the limit of 180 leaves room for about twice the longer.
  e2e-stability:
    name: e2e stability (ubuntu-latest, ${{ matrix.browser }}, 20 repetitions)
    needs: [plan, engines]
    if: needs.plan.outputs.e2e_stability == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The same cache entries as e2e (ubuntu-latest, one browser each). The path list must be the
      # e2e job's, line for line: actions/cache derives an entry's version from its paths, so an
      # entry saved under three paths is not found by a restore that names one.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}
      - name: Install ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install the system libraries for ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Production build
        run: npm run build
      # The dot reporter keeps the log of 20 repetitions short; the HTML report is uploaded on failure.
      - name: End-to-end tests, 20 repetitions
        run: npm run test:e2e -- --project ${{ matrix.browser }} --repeat-each=20 --reporter=dot,html
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-stability-${{ matrix.browser }}
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # 6.9 item 9 (docs/requests/P1-perf-scripts.md): tests/perf/check-perf.mjs in the real application,
  # one browser per job, on the three systems. On a push only the parts a program observes are run
  # (calibrate: the program's own clock at the default speed and at Maximum; surface: a 4096 x 4096
  # surface resized, cleared, filled and presented). What the program observes (its counts and
  # divisions, the surface's pixels) is judged on every system; the default-speed rate of 1,000,000
  # per second is judged only in Chromium on ubuntu-latest (--judge auto) and printed with "would
  # pass" or "would MISS" elsewhere. On a manual run and on a v* tag every part runs with
  # --judge auto: the wall-clock thresholds of 6.9 item 9 are judged in Chromium on ubuntu-latest,
  # where 6.9 sets them, and printed with "would pass" or "would MISS" elsewhere (erratum P1 1
  # and 2). perf.json, with every figure of the run, is uploaded every time.
  perf:
    name: perf (${{ matrix.os }}, ${{ matrix.browser }})
    needs: [plan, engines]
    if: needs.plan.outputs.perf == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        browser: [chromium, webkit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
      EASY68K_REQUIRE_BROWSERS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # The e2e job's cache entries (one browser each), with its path list line for line.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}
      - name: Install ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install the system libraries for ${{ matrix.browser }}
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Performance check (P1)
        env:
          FULL: ${{ needs.plan.outputs.perf_full }}
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$FULL" = true ]; then
            npm run check:perf -- --browser "$BROWSER" --judge auto
          else
            npm run check:perf -- --browser "$BROWSER" --only calibrate --only surface
          fi
      - name: Upload the figures and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-${{ matrix.os }}-${{ matrix.browser }}
          path: |
            build/P1/perf-check/
            !build/P1/perf-check/vite-cache/
          if-no-files-found: warn
          retention-days: 90

  # docs/requests/DOC1-docs-check.md item 3: README.md's commands, literally, on the two systems on
  # which no other job builds the engines or runs the type check and lint (DOC1 ran them on Linux in a
  # clean node:24 container). The working copy stands for `git clone` and `cd`. Weekly, and on a
  # manual run with the input readme ticked; Emscripten is installed by the README's own command.
  readme:
    name: readme (${{ matrix.os }})
    needs: [plan]
    if: needs.plan.outputs.readme == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      EASY68K_REQUIRE_ENGINES: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:emsdk
      - run: npm run build:engines
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:conformance
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-readme-${{ matrix.os }}
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The browser checks that exist before the end-to-end suites do: one script
  # per package (check-<name>.mjs, the convention of check-shell.mjs), each
  # against the Vite dev server on a free port or, for check:pwa, against its
  # own production build, in Chromium and WebKit on the three systems.
  # EASY68K_REQUIRE_BROWSERS=1: a browser that is not installed is a failure,
  # not a skip. EASY68K_REQUIRE_ENGINES=1 when engine-dist holds both engines.
  #
  # The checks take too long for one runner, so the matrix splits them in three
  # groups: `interface` (the editor side, the shell, Help, EASyBIN; only
  # check:assemble needs the engines), `simulator` (the checks that load the
  # engines) and `integration` (the scenarios of the integration gates). A step
  # that needs both engines is skipped when engine-dist does not hold them.
  # Measured at gate I1 (Windows 11 PC under heavy load, both browsers, one
  # check at a time per queue): interface about 16 minutes (gallery 73 s,
  # shell 189, editor 159, highlight 23, files 136 or more, documents 25, help
  # 176, surface 13, easybin 196), simulator about 14 minutes (engine 44, pwa 67, text 10,
  # output 227, hardware 49, run 66, sim-main 298, memory-stack 66): about 30
  # minutes together, more than one runner should take.
  # On GitHub (run 44913261966, the first with every check), whole jobs including set-up:
  # interface 7.2 min (Ubuntu), 10.8 (macOS), 6.9 (Windows); simulator 7.8, 9.6 and 6.8. The
  # longest steps were sim-main 3.4 min and output 2.4 on macOS. The limit of 45 minutes leaves
  # room for four times that. Run 44919519853 (gate I1 round 2, with check:wave1 in `simulator`):
  # interface 7.3 / 8.9 / 9.3 min (Ubuntu / macOS / Windows), simulator 9.7 / 13.2 / 10.9;
  # check:wave1 took 2.1 / 2.7 / 2.5 min of that, sim-main 1.8 / 3.4 / 2.0.
  # Run 44937920498 (commit fdabb2b, before wave two): interface 6.5 / 10.4 min on Ubuntu / macOS,
  # simulator 10.5 / 13.7 / 10.7 (check:wave1 2.9 / 3.3 / 3.0 of it). On Windows the interface
  # job was cancelled at its 45-minute limit: check:files stopped printing at "[webkit, a page
  # killed in the middle of a write]" and hung for 39 minutes, so the four checks after it never
  # ran. Since gate I2 every check step therefore has a limit of its own, 15 minutes (the longest
  # step so far took 3.4 on macOS): a check that hangs fails alone and the rest of the group runs.
  #
  # Gate I2 adds ten checks. Measured on this PC (one at a time per queue, two queues, heavy load):
  # options 192-215 s, find 93-275, print 10-79, fsaccess 59-142, assemble 329, audio 16,
  # sim-files 55, breakpoints 263, log 346; check:wave2 is new. GitHub's runners took about 0.7
  # times this PC's figures for the checks of wave one. Two groups would have put the simulator
  # group near 30 minutes on macOS, so the two integration scenarios (check:wave1, check:wave2)
  # have a group of their own, `integration`, and check:assemble (E5, an editor feature that needs
  # the engines) is in `interface`, which downloads engine-dist too. Expected on macOS: interface
  # about 20 min, simulator about 20, integration about 10; the limit of 45 leaves room for twice.
  # Re-measured in round 1 of gate I2, after the restart (this PC, two queues): options 108 s,
  # find 170, print 47, fsaccess 109, assemble 146 (interface: 580 s added); audio 48, sim-files
  # 115, breakpoints 153, log 187 (simulator: 503 s added).
  # On GitHub, run 44958853557 (commit d771d77, every check of waves one and two), whole jobs
  # including set-up, Ubuntu / macOS / Windows: interface 10.0 / 11.2 / 8.8 min, simulator 8.8 /
  # 11.6 / 8.1, integration 5.3 / 6.7 / 6.2. The longest step was check:sim-main on macOS, 3.8
  # min (check:wave1 3.1, check:wave2 2.8); check:log took 0.8 / 1.2 / 0.7. Both limits (45 per
  # job, 15 per step) leave room for about four times that.
  browser-checks:
    name: browser-checks (${{ matrix.os }}, ${{ matrix.group }})
    needs: [plan, engines]
    if: needs.plan.outputs.browser_checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        group: [interface, simulator, integration, accessibility]
    runs-on: ${{ matrix.os }}
    # The accessibility audit is one check of about half an hour on the development PC: two steps
    # of up to 30 minutes, so its group has a longer limit than the others.
    timeout-minutes: ${{ matrix.group == 'accessibility' && 75 || 45 }}
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
      EASY68K_REQUIRE_BROWSERS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps: actions/cache saves only at the end of a green job, and
      # with one failing check among seventeen a new Playwright version would never be cached.
      - name: Restore Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Playwright's default browser folder on Linux, macOS and Windows.
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-chromium-webkit
      - name: Install Chromium and WebKit
        id: browsers-install
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      # All groups of one system use the same key; a later save only warns that it exists.
      - name: Save Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true' && steps.browsers-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-chromium-webkit
      - name: Install the system libraries for Chromium and WebKit
        if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium webkit
      # Each check runs even when an earlier one failed, so that one run shows all of them.
      # Group `interface`:
      - name: Gallery check (W2)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.gallery == 'true' }}
        timeout-minutes: 15
        run: npm run check:gallery
      - name: Shell check (W3)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.shell == 'true' }}
        timeout-minutes: 15
        run: npm run check:shell
      - name: Editor check (E2)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.editor == 'true' }}
        timeout-minutes: 15
        run: npm run check:editor
      - name: Syntax highlighting check (E3)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.highlight == 'true' }}
        timeout-minutes: 15
        run: npm run check:highlight
      # check:files proves an exported archive with the system's own tool: Python's zipfile,
      # unzip or bsdtar, whichever the runner has (all three runners have Python).
      - name: Files check (FS1)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.files == 'true' }}
        timeout-minutes: 15
        run: npm run check:files
      - name: Documents check (E1)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.documents == 'true' }}
        timeout-minutes: 15
        run: npm run check:documents
      - name: Help check (H1)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.help == 'true' }}
        timeout-minutes: 15
        run: npm run check:help
      - name: Drawing surface check (SH1)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.surface == 'true' }}
        timeout-minutes: 15
        run: npm run check:surface
      - name: EASyBIN check (B1)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.easybin == 'true' }}
        timeout-minutes: 15
        run: npm run check:easybin
      # Wave two (gate I2), group `interface`: of these only check:assemble needs engine/dist.
      - name: Options dialogs check (E4)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.options == 'true' }}
        timeout-minutes: 15
        run: npm run check:options
      - name: Find and Replace check (E6)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.find == 'true' }}
        timeout-minutes: 15
        run: npm run check:find
      - name: Print check (E6)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.print == 'true' }}
        timeout-minutes: 15
        run: npm run check:print
      - name: File System Access check (FS2)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.fsaccess == 'true' }}
        timeout-minutes: 15
        run: npm run check:fsaccess
      # check:assemble needs engine/dist (F9 assembles, Execute runs): without it the script says it
      # was skipped and exits 0, and fails then when EASY68K_REQUIRE_ENGINES=1, like check:output.
      - name: Assemble check (E5)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.assemble == 'true' }}
        timeout-minutes: 15
        run: npm run check:assemble
      # The stage of additions (ARCHITECTURE-PLUS P5), group `interface`: none needs engine/dist.
      - name: Dock layout check (N1)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.dock == 'true' }}
        timeout-minutes: 15
        run: npm run check:dock
      - name: Viewer check (N6)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.viewer == 'true' }}
        timeout-minutes: 15
        run: npm run check:viewer
      - name: Status bar place texts check (N8)
        if: ${{ !cancelled() && matrix.group == 'interface' && needs.plan.outputs.status == 'true' }}
        timeout-minutes: 15
        run: npm run check:status
      # Group `simulator`:
      - name: Engine binding in the browser (W4)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.engine_browsers == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:engine-browsers
      - name: Upload the engine binding's memory figures
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.engine_browsers == 'true' && needs.engines.outputs.available == 'asm sim' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-binding-browsers-${{ matrix.os }}
          path: build/reports/engine-binding-browsers.json
          if-no-files-found: warn
          retention-days: 90
      - name: Offline, install and Pages check (DV1)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.pwa == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:pwa
      - name: Text screen check (SH3)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.text == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:text
      # check:output and check:hardware skip their engine parts by themselves when
      # engine/dist is missing (and fail then when EASY68K_REQUIRE_ENGINES=1); so does
      # check:shell above for its simulator session. check:hardware --without-engines proves it.
      - name: Output panel check (SH4)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.output == 'true' }}
        timeout-minutes: 15
        run: npm run check:output
      - name: Hardware panel check (SH7)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.hardware == 'true' }}
        timeout-minutes: 15
        run: npm run check:hardware
      - name: Run check (SH8)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.run == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:run
      - name: Registers, Listing and Messages check (U1)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.sim_main == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:sim-main
      - name: Memory and Stack check (U2)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.memory_stack == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:memory-stack
      # Wave two (gate I2), group `simulator`. check:sim-files, check:breakpoints and check:log need
      # engine/dist for (part of) their work and skip it by themselves when it is missing, or fail
      # then when EASY68K_REQUIRE_ENGINES=1, like check:output; check:audio needs no engine.
      - name: Sound check (SH5)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.audio == 'true' }}
        timeout-minutes: 15
        run: npm run check:audio
      - name: Program files check (SH6)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.sim_files == 'true' }}
        timeout-minutes: 15
        run: npm run check:sim-files
      - name: Break Points check (U3)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.breakpoints == 'true' }}
        timeout-minutes: 15
        run: npm run check:breakpoints
      - name: Logging and simulator options check (U4)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.log == 'true' }}
        timeout-minutes: 15
        run: npm run check:log
      # Wave three (gate I3 preparation), group `simulator`. Both need both engines and fail without
      # them when EASY68K_REQUIRE_ENGINES=1. check:examples (X3, 6.5.4): the 34 example programs'
      # surface hash in Chromium and WebKit equals the committed golden and the screenshot shows
      # exactly those pixels; about a minute per browser. check:desktop-devices (DV4): the web build
      # gives every serial and network task the values of note 37.
      - name: Whole-program pixel check (X3)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.examples == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:examples
      - name: Serial and network in the web build (DV4)
        if: ${{ !cancelled() && matrix.group == 'simulator' && needs.plan.outputs.desktop_devices == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:desktop-devices
      # Group `accessibility`: the audit of Q1 (2.9-2.11, 6.9 item 8; docs/requests/Q1-a11y-ci.md), one
      # browser per step. Known application defects are entered in docs/integration/rc.md and
      # tests/a11y/lib/findings.mjs and print "known" without failing; I3 gates on that list, not on
      # this step alone.
      - name: Accessibility audit in Chromium (Q1)
        if: ${{ !cancelled() && matrix.group == 'accessibility' && needs.plan.outputs.a11y == 'true' }}
        timeout-minutes: 30
        run: npm run check:a11y -- --browser chromium
      - name: Accessibility audit in WebKit (Q1)
        if: ${{ !cancelled() && matrix.group == 'accessibility' && needs.plan.outputs.a11y == 'true' }}
        timeout-minutes: 30
        run: npm run check:a11y -- --browser webkit
      # Group `integration`: the scenarios of the integration gates (ARCHITECTURE.md 9.3, 9.5).
      - name: Integration scenario in the browser (I1)
        if: ${{ !cancelled() && matrix.group == 'integration' && needs.plan.outputs.wave1 == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:wave1
      - name: Integration scenario in the browser (I2)
        if: ${{ !cancelled() && matrix.group == 'integration' && needs.plan.outputs.wave2 == 'true' && needs.engines.outputs.available == 'asm sim' }}
        timeout-minutes: 15
        run: npm run check:wave2
      # The stage of additions (ARCHITECTURE-PLUS P5), group `integration` (the shortest group):
      # the history store on real IndexedDB, its dialogs, and the Port Additions dialog (its Empty
      # Trash and storage figures; docs/requests/N7.md item 1). None needs engine/dist.
      - name: History store check (N3)
        if: ${{ !cancelled() && matrix.group == 'integration' && needs.plan.outputs.history == 'true' }}
        timeout-minutes: 15
        run: npm run check:history
      - name: History and Trash dialogs check (N4)
        if: ${{ !cancelled() && matrix.group == 'integration' && needs.plan.outputs.history_ui == 'true' }}
        timeout-minutes: 15
        run: npm run check:history-ui
      - name: Port Additions dialog check (N7)
        if: ${{ !cancelled() && matrix.group == 'integration' && needs.plan.outputs.additions == 'true' }}
        timeout-minutes: 15
        run: npm run check:additions
      - name: Upload the screenshots of the browser checks
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks-screenshots-${{ matrix.os }}-${{ matrix.group }}
          path: |
            build/gallery-check/
            build/shell-check/
            build/E2/editor-check/
            build/E3/highlight-check/
            build/FS1/files-check/
            build/E1/documents-check/
            build/help-check/
            build/surface-check/
            build/B1/check/
            build/pwa-check/
            !build/pwa-check/dist/
            build/text-check/
            build/output-check/
            build/SH7/hardware-check/
            build/SH8/run-check/
            build/U1/sim-main-check/
            build/U2/check/
            build/I1/wave1-check/
            build/E4/options-check/
            build/E6/find-check/
            build/E6/print-check/
            build/FS2/fsaccess-check/
            !build/FS2/fsaccess-check/vite-cache/
            build/E5/assemble-check/
            build/SH5/audio-check/
            build/SH6/sim-files-check/
            !build/SH6/sim-files-check/vite-cache/
            build/U3/breakpoints-check/
            build/U4/log-check/
            !build/U4/log-check/vite-cache/
            build/I2/wave2-check/
            !build/I2/wave2-check/vite-cache/
            !build/I2/wave2-check/dist/
            build/X3/check/
            build/DV4/desktop-devices-check/
            build/Q1/a11y-check/
            build/dock-check/
            build/history-check/
            build/history-ui-check/
            build/viewer-check/
            build/N8-plus/status-check/
            build/N7-plus/additions-check/
          if-no-files-found: ignore
          retention-days: 14

  windows-oracles:
    name: windows-oracles
    needs: [plan, engines]
    if: needs.plan.outputs.windows_oracles == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      EMSDK_VERSION: '7.0.0'
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist

      # The three oracles are independent: each runs even when an earlier one failed.
      - name: GDI capture, regenerate and compare (T2)
        id: gdi
        if: ${{ !cancelled() && needs.plan.outputs.gdi == 'true' }}
        run: npm run oracle:gdi
      # On a Windows other than the references' (tests/oracle/gdi-capture/windows-policy.ts), the
      # step fails until a person has looked at the differences and recorded them in
      # other-windows.json. What they look at is the capture of this run (build/gdi-capture/run,
      # about 25 MB), which leaves with the runner unless it is uploaded here.
      - name: Upload the GDI capture of this run (T2)
        if: ${{ !cancelled() && steps.gdi.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdi-capture-run
          path: build/gdi-capture/run/
          if-no-files-found: ignore
          retention-days: 14
      # The short form of the same (T2-gdi-fonts.md item 6), on every run of the GDI step: the
      # report and only the captured files that differ from the committed references (about 2 MB
      # at most), so that a person can look at them without the 25 MB of the whole capture.
      - name: Upload the GDI capture report (T2)
        if: ${{ !cancelled() && needs.plan.outputs.gdi == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gdi-capture-report
          path: |
            build/gdi-capture/run/report.txt
            build/gdi-capture/run/differences/
          if-no-files-found: ignore
          retention-days: 14
      # The 68000 single-step suite (about 200 MB) is cached by the hash of its manifest.
      # fetch-suite.mjs checks every cached file again (size, git SHA-1, SHA-256) and downloads
      # only what is missing or wrong, so a stale or partial cache cannot pass. The cache is saved
      # here, after a complete fetch, and not at the end of the job, so that it is kept even when
      # another oracle step fails.
      - name: Restore the 68000 single-step suite (T4)
        id: singlestep
        if: ${{ !cancelled() && needs.plan.outputs.twins == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/singlestep
          key: singlestep-${{ hashFiles('tests/conformance/cpu/suite.json') }}
      - name: Fetch and verify the 68000 single-step suite (T4)
        id: singlestep-fetch
        if: ${{ !cancelled() && needs.plan.outputs.twins == 'true' }}
        run: node tests/conformance/cpu/fetch-suite.mjs --quiet
      - name: Save the 68000 single-step suite (T4)
        if: ${{ !cancelled() && needs.plan.outputs.twins == 'true' && steps.singlestep.outputs.cache-hit != 'true' && steps.singlestep-fetch.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/singlestep
          key: singlestep-${{ hashFiles('tests/conformance/cpu/suite.json') }}
      - name: Native twins (T4)
        if: ${{ !cancelled() && needs.plan.outputs.twins == 'true' }}
        run: npm run oracle:twins
      - name: Upload the native-twin report (T4)
        if: ${{ !cancelled() && needs.plan.outputs.twins == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-twin-report
          path: |
            build/native-twin/report.md
            build/native-twin/work/sim/runs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Command-line assembler oracle (T1)
        if: ${{ !cancelled() && needs.plan.outputs.asm_cli == 'true' }}
        run: node tests/oracle/asm-cli/run.mjs

      # Weekly: build the engines on Windows and compare the .wasm files with
      # the canonical Linux build. A difference is reported, never a failure.
      - name: Restore Emscripten (weekly engine comparison)
        if: needs.plan.outputs.engines_weekly == 'true' && needs.engines.outputs.available != ''
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Emscripten (weekly engine comparison)
        if: needs.plan.outputs.engines_weekly == 'true' && needs.engines.outputs.available != '' && steps.emsdk-cache.outputs.cache-hit != 'true'
        run: npm run setup:emsdk
      - name: Build the engines on Windows and compare with Linux (weekly)
        if: needs.plan.outputs.engines_weekly == 'true' && needs.engines.outputs.available != ''
        continue-on-error: true
        run: |
          mkdir -p build/engine-dist-linux
          cp engine/dist/* build/engine-dist-linux/
          node tools/build-engines.mjs
          {
            echo "### Windows engine build vs Linux (.wasm SHA-256)"
            echo "| file | Linux | Windows | |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for linux in build/engine-dist-linux/*.wasm; do
            name=$(basename "$linux")
            a=$(sha256sum "$linux" | cut -d' ' -f1)
            b=$( [ -f "engine/dist/$name" ] && sha256sum "engine/dist/$name" | cut -d' ' -f1 || echo missing)
            if [ "$a" = "$b" ]; then verdict=same; else verdict=DIFFERENT; echo "::warning title=Engine build differs::$name built on Windows differs from the Linux build ($b vs $a)"; fi
            echo "| $name | \`$a\` | \`$b\` | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done

  desktop-dev:
    name: desktop-dev (macos-15)
    needs: [plan, engines]
    if: needs.plan.outputs.desktop_dev == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      - name: Electron version
        id: electron
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"
      # Restore and save apart, so that the download is cached even when a desktop test fails.
      - name: Restore the Electron download
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ steps.electron.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the Electron binary
        run: node node_modules/electron/install.js
      - name: Save the Electron download
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ steps.electron.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - name: Production build of the app
        run: npm run build
      - name: Desktop development-build tests (6.7)
        run: npm run desktop:test -- dev
      # tests/desktop/dev/playwright.config.ts writes its results and report below build/desktop-dev.
      - name: Upload the desktop test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dev-results
          path: |
            build/desktop-dev/test-results/
            build/desktop-dev/report/
          if-no-files-found: ignore
          retention-days: 14
