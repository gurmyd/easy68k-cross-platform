# The oracles that are too slow or too heavy for every push (ARCHITECTURE.md 6.1, 6.2.2, 7.4):
# weekly and on demand.
#
#   wine        runs the conformance tests against the committed goldens; fetches the official
#               EASy68K v5.16.1 distribution, builds the Wine container (restored from the cache
#               while the Dockerfile and the scripts are unchanged), and, only when both succeeded,
#               - regenerates the goldens of the tracked sets with the official EDIT68K.exe
#                 (npm run oracle:wine:asm) and with the official SIM68K.exe (npm run oracle:wine:sim);
#               - fetches the `site` set (not redistributable, never committed), runs it through
#                 the official editor and compares the hashes with tests/corpus/manifest.json;
#               - runs the conformance tests against what it regenerated and over the site set
#                 (rewriting MISMATCHES.md from the regenerated goldens);
#               - says what the regeneration changed: nothing, or a candidate (the files, listed in
#                 the log and the job's summary). The job fails while a candidate exists, because
#                 the official programs then produce something the repository does not hold and
#                 nobody has accepted; a person accepts it by merging the branch `propose` pushed.
#   propose     when the job wine has a candidate: pushes it to the branch
#               oracle/regenerated-<run id> and names in the job's summary the changed files and
#               the address at which a person opens the pull request. It opens none itself (the
#               repository does not let GitHub Actions create pull requests; erratum T1 27). It is
#               the only job with write access, and it handles nothing but those files.
#   singlestep  downloads the single-step CPU suites and re-checks the frozen baseline. Written
#               for work package T4: it is skipped until tests/conformance/cpu/run-singlestep.mjs
#               exists.
#
# The official programs are downloaded at run time into the runner's work folder, mounted
# read-only into the container and run only there. They are never committed, cached or baked
# into the image.
#
# Owner: work package T1.

name: oracle

on:
  schedule:
    # Weekly, Tuesday 03:41 UTC.
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '1'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

defaults:
  run:
    shell: bash

jobs:
  engines:
    name: engines
    uses: ./.github/workflows/engines.yml

  wine:
    name: wine (official EDIT68K.exe and SIM68K.exe)
    needs: [engines]
    # Pinned: on ubuntu-latest = ubuntu-26.04 (image 20261116) the image build stops at wineboot
    # with "wineserver: socket: Function not implemented" (32-bit Wine cannot create its socket
    # there; run 45003265263). ubuntu-24.04 is what ubuntu-latest was before; on Docker Desktop
    # (WSL 2) the same Dockerfile builds and runs. Move back only after a run of this job passes.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
      # Containers in parallel: one per core of the runner.
      CONTAINERS: '4'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download engine-dist
        if: needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist

      # The port against the goldens as committed, before anything is regenerated: so that a failure
      # of the comparison later in this job can be told apart from one the repository already has.
      # Without the site set, which is fetched further down. Its failure does not stop the steps
      # below (continue-on-error); the last step but one fails the job for it.
      - name: Conformance tests against the committed goldens
        id: committed
        continue-on-error: true
        run: npm run test:conformance

      # Before the image: the download needs nothing of it.
      - name: Fetch the official EASy68K v5.16.1 distribution
        id: official
        run: node tests/oracle/wine/common/fetch-official.mjs

      # The image (2.4 GB) takes three minutes to build and changes only with these files.
      # Of the simulator's folder only sim_run.py is copied into it; the rest of the driver is
      # mounted at run time (docs/requests/T3-oracle-image.md).
      - name: Restore the Wine image
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/oracle-wine/image.tar
          key: oracle-wine-image-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/oracle/wine/Dockerfile', 'tests/oracle/wine/common/*.sh', 'tests/oracle/wine/common/*.py', 'tests/oracle/wine/asm/*.sh', 'tests/oracle/wine/asm/*.py', 'tests/oracle/wine/sim/sim_run.py') }}
      - name: Load the Wine image
        if: steps.image.outputs.cache-hit == 'true'
        run: docker load --input build/oracle-wine/image.tar
      - name: Build the Wine image
        if: steps.image.outputs.cache-hit != 'true'
        run: |
          npm run oracle:wine:build
          mkdir -p build/oracle-wine
          docker save --output build/oracle-wine/image.tar easy68k-oracle-wine

      # Runs only when every step above succeeded: the image is there and so are the
      # official programs. Every step below that runs an official program, or reports on what one
      # produced, requires it, so a failed build or download is not followed by secondary failures
      # or by a report of results that were never produced (run 45003265263, erratum T1 23). It also
      # prints the host's kernel: the same image gives other bytes where the original reads memory it
      # never wrote (run 45034017858, errata T1 27 and T3 16).
      - name: The image and the official programs are ready
        id: ready
        run: |
          docker image inspect easy68k-oracle-wine --format 'Image {{.Id}}'
          echo "Host kernel: $(uname -r)"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Regenerate the assembler goldens of the tracked sets
        id: asm
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}
        run: npm run oracle:wine:asm -- --containers "$CONTAINERS"
      - name: Regenerate the simulator goldens (T3)
        id: sim
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' && hashFiles('tests/oracle/wine/sim/regenerate.mjs') != '' }}
        run: npm run oracle:wine:sim

      - name: Fetch the site set
        if: ${{ !cancelled() }}
        run: node tools/fetch-site-examples.mjs
      - name: The site set through the official assembler, compared with the manifest
        if: ${{ !cancelled() && steps.ready.outputs.ok == 'true' }}
        run: node tests/oracle/wine/asm/regenerate.mjs --sets site --check --containers "$CONTAINERS"

      # The port against the regenerated goldens, and over the site set when it was fetched: so only
      # after a completed regeneration of the assembler goldens. MISMATCHES.md is an output of this
      # run here (EASY68K_SIM_REPORT=1), not a file to compare with: it describes the regenerated
      # goldens, and goes into the candidate with them when it changed (run 45034017858 compared it
      # with the committed one and failed for that alone).
      - name: Conformance tests against the regenerated goldens
        id: regenerated
        if: ${{ !cancelled() && steps.asm.outcome == 'success' }}
        env:
          EASY68K_SIM_REPORT: '1'
        run: npm run test:conformance

      # What the regeneration changed in the repository's files: nothing, or a candidate. A candidate
      # is proposed only when every regeneration that ran completed; a partial regeneration is listed
      # for diagnosis but not proposed.
      - name: What changed
        id: diff
        if: ${{ !cancelled() }}
        env:
          READY: ${{ steps.ready.outputs.ok }}
          ASM_OUTCOME: ${{ steps.asm.outcome }}
          SIM_OUTCOME: ${{ steps.sim.outcome }}
        run: |
          # Goldens, the manifest and the reports: everything a regeneration may write.
          paths=(tests/corpus/manifest.json tests/conformance)
          if [ "$READY" != 'true' ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing was regenerated: the Wine image or the official distribution is missing (see the steps above)."
            exit 0
          fi
          if [ "$ASM_OUTCOME" != 'success' ] || { [ "$SIM_OUTCOME" != 'success' ] && [ "$SIM_OUTCOME" != 'skipped' ]; }; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The regeneration did not complete (assembler: $ASM_OUTCOME, simulator: $SIM_OUTCOME): nothing is proposed."
            echo "Files it wrote before it stopped:"
            git status --short -- "${paths[@]}" | head -50
            exit 0
          fi
          git add --all -- "${paths[@]}"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The official programs produced what the repository holds."
            echo "The official programs produced what the repository holds: nothing changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mkdir -p build/oracle-wine/changed
            git diff --cached --name-status -- "${paths[@]}" > build/oracle-wine/changed/changed.txt
            {
              echo 'The regeneration changed these files (A added, M modified, D deleted, R renamed):'
              cat build/oracle-wine/changed/changed.txt
              echo
              echo 'Expected after a change of a program, of the driver or of the image; otherwise the official'
              echo 'programs gave this runner another result than the machine that made the committed goldens.'
              echo 'Find out which before accepting: the lines "differ from the manifest" and "changed" of the'
              echo 'two regeneration steps name the runs, and errata T1 27 and T3 16 the known host-dependent ones.'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat -- "${paths[@]}" | tail -50
            git diff --cached --name-only --diff-filter=D -- "${paths[@]}" > build/oracle-wine/changed/deleted.txt
            git diff --cached --name-only --diff-filter=d -z -- "${paths[@]}" |
              tar --create --null --files-from=- --file build/oracle-wine/changed/files.tar
          fi
      - name: Upload the changed files
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-changed
          path: |
            build/oracle-wine/changed/files.tar
            build/oracle-wine/changed/deleted.txt
            build/oracle-wine/changed/changed.txt
          retention-days: 14

      # A candidate is accepted by a person, by merging the branch that the job `propose` pushes;
      # until then the official programs produce something the repository does not hold, and this
      # job says so and fails.
      - name: The port passed the conformance tests against the committed goldens
        if: ${{ !cancelled() && steps.committed.outcome == 'failure' }}
        run: |
          echo "::error title=Conformance tests failed::The conformance tests failed against the goldens as committed, before any regeneration: see the step 'Conformance tests against the committed goldens'."
          exit 1
      - name: The repository holds what the official programs produced
        if: ${{ !cancelled() && steps.diff.outputs.changed == 'true' }}
        run: |
          echo "::error title=Regenerated goldens differ::The official programs produced files the repository does not hold and nobody has accepted: $(cut -f2- build/oracle-wine/changed/changed.txt | paste -sd ' ' -). The job 'propose the regenerated goldens' pushes them to the branch oracle/regenerated-${GITHUB_RUN_ID}; merging it accepts them."
          cat build/oracle-wine/changed/changed.txt
          exit 1

      - name: Upload the logs of the runs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-wine-work
          # Logs, job lists and the per-file reports. Not the outputs and not the screenshots of
          # failures: both can show text of the site set, which may not be redistributed.
          path: |
            build/oracle-wine/asm/*/container-*.log
            build/oracle-wine/asm/*/job/jobs.jsonl
            build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # Pushes the candidate of the job wine to a new branch and says in the job's summary what changed
  # and where a person opens the pull request. It opens none itself: the repository does not let
  # GitHub Actions create pull requests (run 45034017858: "GitHub Actions is not permitted to create
  # or approve pull requests"), and the project keeps that setting off (erratum T1 27).
  propose:
    name: propose the regenerated goldens
    needs: [wine]
    if: ${{ !cancelled() && needs.wine.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the changed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oracle-changed
          path: build/oracle-changed
      - name: Push the branch and name it in the summary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: oracle/regenerated-${{ github.run_id }}
          NEW_PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/new/oracle/regenerated-${{ github.run_id }}
        run: |
          set -eu
          # Only files below these folders are accepted from the artifact.
          while IFS= read -r name; do
            case "$name" in
              tests/corpus/manifest.json|tests/conformance/*) ;;
              *) echo "unexpected path in the artifact: $name" >&2; exit 1 ;;
            esac
          done < <(tar --list --file build/oracle-changed/files.tar)
          tar --extract --file build/oracle-changed/files.tar
          while IFS= read -r name; do
            case "$name" in
              tests/corpus/manifest.json|tests/conformance/*) git rm --quiet --ignore-unmatch -- "$name" ;;
              '') ;;
              *) echo "unexpected path in the list of deleted files: $name" >&2; exit 1 ;;
            esac
          done < build/oracle-changed/deleted.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add --all -- tests/corpus/manifest.json tests/conformance
          git commit --quiet -m 'Regenerate the goldens of the official EASy68K (Wine oracle)'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo '## Wine oracle: regenerated goldens differ'
            echo
            echo "The official EASy68K v5.16.1 programs gave other results than the repository holds. They are on the branch \`$BRANCH\` (run: $RUN_URL)."
            echo
            echo 'Changed files (A added, M modified, D deleted, R renamed):'
            echo
            echo '```'
            cat build/oracle-changed/changed.txt
            echo '```'
            echo
            echo "A person opens the pull request by hand: $NEW_PR_URL"
            echo
            echo "Read \`tests/conformance/asm/golden/REPORT.md\` and the diff of \`tests/corpus/manifest.json\` and \`tests/conformance/sim/golden/manifest.json\` first: a changed hash or count means that the automation, Wine, the host or a tracked source changed, never the official programs. Do not merge before the cause is known."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed $BRANCH; open the pull request at $NEW_PR_URL"

  singlestep:
    name: single-step CPU suites (frozen baseline)
    needs: [engines]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EASY68K_REQUIRE_ENGINES: ${{ needs.engines.outputs.available == 'asm sim' && '1' || '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the runner there yet
        id: guard
        run: |
          if [ -f tests/conformance/cpu/run-singlestep.mjs ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "tests/conformance/cpu/run-singlestep.mjs does not exist yet (work package T4): nothing to do."
          fi
      - name: Set up Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci
      - name: Download engine-dist
        if: steps.guard.outputs.run == 'true' && needs.engines.outputs.available != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-dist
          path: engine/dist
      # The suites are never committed (6.2.4). suite.json names the upstream files and their hashes,
      # so the downloaded data is good for as long as suite.json is unchanged, and a change of another
      # T4 file does not download the 200 MB again (the key of ci.yml; T4's request, gate I1).
      - name: Restore the single-step data
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/singlestep
          key: singlestep-${{ hashFiles('tests/conformance/cpu/suite.json') }}
      - name: Download the suites and re-check the frozen baseline
        if: steps.guard.outputs.run == 'true'
        run: node tests/conformance/cpu/run-singlestep.mjs
